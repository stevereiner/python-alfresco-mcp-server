[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alfresco_mcp_server"]

[tool.hatch.build.targets.sdist]
only-include = [
    "alfresco_mcp_server",
    "claude-desktop-configs",
    "mcp-inspector-configs",
    "docs",
    "examples",
    "scripts",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "prompts-for-claude.md",
    "pyproject.toml",
    "pytest.ini",
    "uv.lock",
    "config.yaml",
    "sample-dot-env.txt",
    "run_server.py",
]
exclude = [
    "venv/**",
    ".venv/**",
    "venv-*/**",
    "**/__pycache__/**",
    "**/*.pyc",
    "**/console-log.txt",
]

[project]
name = "python-alfresco-mcp-server"
version = "1.2.1"
description = "FastMCP 3 server for Alfresco Content Services integration"
authors = [{name = "Steve Reiner", email = "example@example.com"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["alfresco", "mcp", "content-management", "fastmcp", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: Content Management System",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # FastMCP 3 - Modern MCP framework with enhanced features
    "fastmcp>=3.4.5,<4",
    
    # Alfresco integration
    "python-alfresco-api>=1.2.2",
    
    # Configuration and utilities
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "PyYAML>=6.0",
    
    # HTTP client
    "httpx>=0.24.0",
    
    # File handling
    "python-multipart>=0.0.6",
]

[project.urls]
Homepage = "https://github.com/stevereiner/python-alfresco-mcp-server"
Repository = "https://github.com/stevereiner/python-alfresco-mcp-server"
Issues = "https://github.com/stevereiner/python-alfresco-mcp-server/issues"
Documentation = "https://github.com/stevereiner/python-alfresco-mcp-server#readme"

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-mock>=3.10.0",
    "coverage[toml]>=7.0.0",
    "httpx>=0.24.0",
]
all = [
    "python-alfresco-mcp-server[dev]",
    "python-alfresco-mcp-server[test]",
]

[project.scripts]
python-alfresco-mcp-server = "alfresco_mcp_server.fastmcp_server:main"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "asyncio: marks tests as async",
    "integration: marks tests as integration tests requiring live Alfresco server",
    "unit: marks tests as unit tests",
    "fastmcp: marks tests as FastMCP specific tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["alfresco_mcp_server"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py310"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B018", "B019"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[dependency-groups]
dev = [
    "build>=1.2.2.post1",
    "twine>=6.1.0",
]
